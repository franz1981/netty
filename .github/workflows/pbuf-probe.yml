name: pbuf-ring probe (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [ "diag/pbuf-ring-probe" ]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install liburing and strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liburing-dev strace > /dev/null

      - name: Build probes
        run: |
          gcc -O0 -static -o pbufprobe .github/pbufprobe.c
          gcc -O0 -o liburingprobe .github/liburingprobe.c -luring

      - name: Host environment
        run: |
          uname -a; cat /proc/version
          cat /proc/sys/kernel/io_uring_disabled || true
          sudo aa-status 2>/dev/null | head -5 || true
          cat /sys/kernel/security/lsm || true
          sudo sysctl -a 2>/dev/null | grep -i uring || true

      - name: Raw probe (unprivileged)
        run: ./pbufprobe

      - name: Raw probe (root)
        run: sudo ./pbufprobe

      - name: liburing probe
        run: ./liburingprobe

      - name: strace io_uring_register
        run: strace -f -e trace=io_uring_setup,io_uring_register ./pbufprobe 2>&1 | tail -20

      - name: dmesg tail
        run: sudo dmesg 2>/dev/null | tail -30 || true
